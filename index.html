<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💕 Para Você 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fundo animado -->
    <div class="background-animation"></div>

    <!-- Botão Flutuante de Música -->
    <button id="btn-musica" class="btn-musica-floating" title="Tocar / Pausar Música">
        <div class="music-bars">
            <span class="bar bar1"></span>
            <span class="bar bar2"></span>
            <span class="bar bar3"></span>
        </div>
        <span class="music-label">Música 🎵</span>
    </button>

    <!-- Container principal -->
    <div class="main-container">
        
        <!-- Coração no centro -->
        <div class="heart-section">
            <div class="heart-container" id="heart-main">
                <svg class="heart-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="heart-clip">
                            <path d="M50,90 C20,70 5,55 5,40 C5,25 15,15 25,15 C35,15 45,25 50,35 C55,25 65,15 75,15 C85,15 95,25 95,40 C95,55 80,70 50,90 Z"/>
                        </clipPath>
                    </defs>
                    <path d="M50,90 C20,70 5,55 5,40 C5,25 15,15 25,15 C35,15 45,25 50,35 C55,25 65,15 75,15 C85,15 95,25 95,40 C95,55 80,70 50,90 Z" fill="none" stroke="#ff1493" stroke-width="2.5"/>
                    <image x="5" y="10" width="90" height="80" 
                           xlink:href="imagem_um.jpg" 
                           clip-path="url(#heart-clip)"
                           xmlns:xlink="http://www.w3.org/1999/xlink"
                           preserveAspectRatio="xMidYMid slice"/>
                </svg>
            </div>
            <div class="heart-pulse"></div>
            <div class="heart-pulse" style="animation-delay: 0.4s;"></div>
            
            <!-- Texto "EU TE AMO" -->
            <div class="text-section">
                <h1 class="big-text">
                    <span class="letter" style="animation-delay: 0s;">E</span>
                    <span class="letter" style="animation-delay: 0.08s;">U</span>
                    <span class="letter" style="animation-delay: 0.16s;">&nbsp;</span>
                    <span class="letter" style="animation-delay: 0.24s;">T</span>
                    <span class="letter" style="animation-delay: 0.32s;">E</span>
                    <span class="letter" style="animation-delay: 0.40s;">&nbsp;</span>
                    <span class="letter" style="animation-delay: 0.48s;">A</span>
                    <span class="letter" style="animation-delay: 0.56s;">M</span>
                    <span class="letter" style="animation-delay: 0.64s;">O</span>
                </h1>
                
                <div class="buttons-section">
                    <a href="acervo.html" class="btn-acervo">
                        <span>📸</span> Acervo de Fotos
                    </a>
                    <a href="oracao.html" class="btn-oracao">
                        <span>🙏</span> Oração
                    </a>
                </div>
            </div>
        </div>

        <!-- Carrossel 3D de Fotos Interativo (Touch & Drag) -->
        <div class="carousel-container" id="carousel-container">
            <div class="carousel" id="carousel-3d">
                <div class="carousel-item" style="--i:1;">
                    <div class="carousel-box">
                        <img src="imagem_dois.jpg" alt="Coca Maracúja">
                    </div>
                    <p>Coca Maracujá</p>
                </div>
                <div class="carousel-item" style="--i:2;">
                    <div class="carousel-box">
                        <img src="imagem_tres.jpg" alt="18">
                    </div>
                    <p>18</p>
                </div>
                <div class="carousel-item" style="--i:3;">
                    <div class="carousel-box">
                        <img src="imagem_quatro.jpg" alt="McQueen e Sally">
                    </div>
                    <p>McQueen e Sally</p>
                </div>
                <div class="carousel-item" style="--i:4;">
                    <div class="carousel-box">
                        <img src="imagem_cinco.jpg" alt="Dupla de Beach Tennis">
                    </div>
                    <p>Dupla Beach Tennis</p>
                </div>
                <div class="carousel-item" style="--i:5;">
                    <div class="carousel-box">
                        <img src="imagem_seis.jpg" alt="Palha Italiana">
                    </div>
                    <p>Palha Italiana</p>
                </div>
                <div class="carousel-item" style="--i:6;">
                    <div class="carousel-box">
                        <img src="imagem_sete.jpg" alt="Abraços quentinhos">
                    </div>
                    <p>Abraços quentinhos</p>
                </div>
            </div>
        </div>

        <!-- Assinatura sutil -->
        <p class="footer-love">feito com todo meu 💕</p>
    </div>

    <!-- Player de Áudio do YouTube -->
    <div id="youtube-player-container" style="position: fixed; width: 1px; height: 1px; bottom: 0; left: 0; opacity: 0.01; pointer-events: none;">
        <div id="player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
    // Configuração do YouTube Player
    let player;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '10',
            width: '10',
            videoId: 'kfXVE5ICOnE',
            playerVars: {
                'autoplay': 1,
                'loop': 1,
                'playlist': 'kfXVE5ICOnE',
                'controls': 0,
                'showinfo': 0,
                'rel': 0
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.playVideo();
        
        // Ativa no primeiro toque se o autoplay foi bloqueado pelo navegador
        const iniciarAudio = () => {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
            document.removeEventListener('click', iniciarAudio);
            document.removeEventListener('touchstart', iniciarAudio);
        };
        document.addEventListener('click', iniciarAudio, { once: true });
        document.addEventListener('touchstart', iniciarAudio, { once: true });
    }

    function onPlayerStateChange(event) {
        const btn = document.getElementById('btn-musica');
        if (!btn) return;
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            btn.classList.add('tocando');
            btn.querySelector('.music-label').textContent = 'Música 🎵';
        } else {
            isPlaying = false;
            btn.classList.remove('tocando');
            btn.querySelector('.music-label').textContent = 'Pausada ⏸️';
        }
    }

    // Botão de controle de música
    document.addEventListener('DOMContentLoaded', () => {
        const btnMusica = document.getElementById('btn-musica');
        if (btnMusica) {
            btnMusica.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!player) return;
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });
        }

        // Interação de Swipe / Arraste 3D no Carrossel
        const carousel = document.getElementById('carousel-3d');
        const container = document.getElementById('carousel-container');
        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        let autoRotateSpeed = 0.2;
        let lastTime = performance.now();
        let manualControl = false;
        let manualTimeout;

        function animateCarousel(now) {
            const delta = (now - lastTime) / 16.66;
            lastTime = now;

            if (!manualControl) {
                currentRotation += autoRotateSpeed * delta;
            }
            if (carousel) {
                carousel.style.transform = `rotateY(${currentRotation}deg)`;
            }
            requestAnimationFrame(animateCarousel);
        }
        requestAnimationFrame(animateCarousel);

        // Touch events
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.buttons-section') || e.target.closest('#btn-musica')) return;
            isDragging = true;
            manualControl = true;
            startX = e.touches[0].clientX;
            clearTimeout(manualTimeout);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diffX = e.touches[0].clientX - startX;
            currentRotation += diffX * 0.4;
            startX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
            manualTimeout = setTimeout(() => {
                manualControl = false;
            }, 3000);
        }, { passive: true });

        // Chuva de confetes e corações sutis
        const cores = ['#ff1493', '#ff69b4', '#ffc0cb', '#fff', '#ffb6d9'];
        for (let i = 0; i < 20; i++) {
            const confete = document.createElement('div');
            const cor = cores[Math.floor(Math.random() * cores.length)];
            const tamanho = 5 + Math.random() * 7;
            const isHeart = Math.random() > 0.6;
            
            confete.style.cssText = `
                position: fixed;
                width: ${tamanho}px;
                height: ${tamanho}px;
                background: ${isHeart ? 'transparent' : cor};
                border-radius: ${isHeart ? '0' : '50%'};
                top: -20px;
                left: ${Math.random() * 100}%;
                animation: confete-drop ${3 + Math.random() * 4}s linear forwards;
                animation-delay: ${Math.random() * 5}s;
                z-index: 10;
                opacity: ${0.5 + Math.random() * 0.5};
                pointer-events: none;
            `;
            if (isHeart) {
                confete.innerHTML = '💕';
                confete.style.fontSize = `${tamanho + 4}px`;
            }
            document.body.appendChild(confete);
            setTimeout(() => confete.remove(), 10000);
        }

        // Clique no coração central solta mini corações
        const heartMain = document.getElementById('heart-main');
        if (heartMain) {
            heartMain.addEventListener('click', (e) => {
                const rect = heartMain.getBoundingClientRect();
                for (let i = 0; i < 6; i++) {
                    const miniHeart = document.createElement('div');
                    miniHeart.textContent = ['💕', '💖', '✨', '💗'][Math.floor(Math.random() * 4)];
                    miniHeart.style.cssText = `
                        position: fixed;
                        left: ${rect.left + rect.width / 2}px;
                        top: ${rect.top + rect.height / 2}px;
                        font-size: ${18 + Math.random() * 12}px;
                        pointer-events: none;
                        z-index: 999;
                        transform: translate(-50%, -50%);
                        animation: heartExplode 1s ease-out forwards;
                        --tx: ${(Math.random() - 0.5) * 120}px;
                        --ty: ${-50 - Math.random() * 100}px;
                    `;
                    document.body.appendChild(miniHeart);
                    setTimeout(() => miniHeart.remove(), 1000);
                }
            });
        }
    });
    </script>
</body>
</html>
